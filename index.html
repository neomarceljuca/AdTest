<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fruit Slice</title>
    <style>
      body {
        margin: 0;
        background: #0b1020;
      }

      #game {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }

      #end-card {
        position: fixed;
        inset: 0;
        padding: 16px;
        overflow: auto;
        background: rgb(24 13 9 / 84%);
        color: #fff4df;
        font-family: sans-serif;
        text-align: center;
      }

      #end-card:not([hidden]) {
        display: grid;
        place-items: center;
      }

      .end-panel {
        box-sizing: border-box;
        width: min(100%, 320px);
        padding: 24px;
        border: 1px solid #7c563c;
        border-radius: 20px;
        background: #2b1c15;
      }

      .end-panel p {
        margin: 0;
        color: #e7c7a4;
      }

      .end-panel h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }

      #round-score {
        font-size: 20px;
      }

      .end-panel .end-credit {
        margin: 22px 0 8px;
        font-size: 14px;
      }

      .end-panel button,
      .end-panel a {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #ffbd72;
        color: #2b1c15;
        font: 700 16px sans-serif;
        text-decoration: none;
        cursor: pointer;
      }

      #play-again {
        margin-top: 8px;
        border-color: #9b7558;
        background: transparent;
        color: #fff4df;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Fruit Slice"></main>
    <section id="end-card" aria-labelledby="round-result" aria-describedby="round-score" hidden>
      <div class="end-panel">
        <h1 id="round-result" tabindex="-1"></h1>
        <p id="round-score"></p>
        <p class="end-credit">Built by Marcel Jucá</p>
        <a href="https://www.marceljuca.com/">View portfolio</a>
        <button id="play-again" type="button">Play again</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
